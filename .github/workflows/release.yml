name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: yocto-lens-linux-amd64
            binary_name: yocto-lens
          - goos: linux
            goarch: arm64
            artifact_name: yocto-lens-linux-arm64
            binary_name: yocto-lens
          - goos: darwin
            goarch: amd64
            artifact_name: yocto-lens-darwin-amd64
            binary_name: yocto-lens
          - goos: darwin
            goarch: arm64
            artifact_name: yocto-lens-darwin-arm64
            binary_name: yocto-lens
          - goos: windows
            goarch: amd64
            artifact_name: yocto-lens-windows-amd64
            binary_name: yocto-lens.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.artifact_name }}/${{ matrix.binary_name }} ./cmd/yocto-lens

      - name: Package Unix binary
        if: matrix.goos != 'windows'
        run: |
          cd dist/${{ matrix.artifact_name }}
          chmod +x yocto-lens
          tar -czf ../${{ matrix.artifact_name }}.tar.gz yocto-lens

      - name: Package Windows binary
        if: matrix.goos == 'windows'
        run: |
          cd dist/${{ matrix.artifact_name }}
          zip -r ../${{ matrix.artifact_name }}.zip yocto-lens.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.zip
          if-no-files-found: ignore

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
